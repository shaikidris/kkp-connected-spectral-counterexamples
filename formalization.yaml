fidelity:
  divergences: >-
    The compared statements are an explicit connected counterexample family
    and its unbounded edge counts. The actual adjacency matrix and its ordered
    eigenvalues are formalized. No claim about the strengthened asymptotic theorem
    of Conjecture 1.17 is selected; a bounded positive excess is compatible with it.
