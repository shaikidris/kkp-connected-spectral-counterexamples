version: v0.4
project:
  name: Connected counterexamples to the exact color-critical two-eigenvalue bound
  description: >-
    For F=K5 minus one edge, a color-critical graph of chromatic number four,
    the graph formed from K(s,s,s) and K4 by one bridge is connected and F-free
    for every integer s at least three. It has 3s squared plus 7 edges, and
    the sum of squares of its two largest ordered adjacency eigenvalues exceeds
    4m/3 by at least (656s squared-1366s+62)/(3(37s-1) squared)>0.
    The family has arbitrarily large edge counts, refuting the exact assertion
    in KKP Conjecture 1.16 and Li–Liu–Zhang Conjecture 5.4.
  authors: [Idris Ali Shaik]
  responsible_maintainers: [Idris Ali Shaik]
  license: Apache-2.0
sources:
  - title: Asymptotic rank two spectral bounds and a color critical counterexample
    type: other
    location: https://chatgpt.com/space/page_53853a02ae28819196935cd71f513605
    relationship: formalizes
    note: >-
      Private informal manuscript supplied as the mathematical source for this
      formalization.
      The section "A connected color-critical counterexample" states and proves
      the same family for every s at least three, with the two integer witnesses
      and exact positive rational gap. The source is not publicly accessible and
      cannot be independently confirmed from this repository. No novelty or priority
      claim is made.
  - title: Localization of spectral Turán-type theorems
    type: paper
    id: arXiv:2512.01409v2
    location: https://arxiv.org/html/2512.01409v2
    authors: [M. Rajesh Kannan, Hitesh Kumar, Shivaramakrishna Pragada]
    relationship: background
    note: Conjecture 1.16 and the connectedness convention in Section 1.1.
  - title: Edge-spectral Turán theorems for color-critical graphs with applications
    type: paper
    id: arXiv:2511.15431v3
    location: https://arxiv.org/html/2511.15431v3
    authors: [Yongtao Li, Hong Liu, Shengtong Zhang]
    relationship: background
    note: Conjecture 5.4.
